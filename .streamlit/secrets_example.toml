# ============================================================================
# secrets_example.toml
# TEMPLATE ONLY - do not put real credentials in this file.
#
# For LOCAL development: copy this file to .streamlit/secrets.toml (same
# folder) and fill in real values. .streamlit/secrets.toml is gitignored and
# must never be committed.
#
# For DEPLOYMENT on Streamlit Community Cloud: do not upload secrets.toml at
# all. Instead paste the same key/value structure below into your app's
# Settings -> Secrets panel in the Streamlit Cloud dashboard - it is fed to
# the app as st.secrets exactly as if this file existed on disk.
# ============================================================================

[postgres]
host = "your-instance.xxxxxxxxxxxx.ap-south-1.rds.amazonaws.com"
port = 5432
dbname = "block_epi_info"
user = "app_user"
password = "REPLACE_ME"
sslmode = "require"

# Used ONLY once, by scripts/init_db.py, to create the first master-admin
# login. After that account exists, these two values are no longer read by
# the running app - change the admin's real password via the in-app User
# Management screen instead of editing this file again.
[bootstrap]
master_admin_username = "admin"
master_admin_password = "REPLACE_ME_BEFORE_FIRST_RUN"
